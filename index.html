<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>從高點回撤買進｜0050 / 比特幣</title>
<base href="./" />
<style>
  :root{--bg:#0f172a;--text:#e2e8f0;--muted:#94a3b8}
  *{box-sizing:border-box;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  body{margin:0;background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:var(--text)}
  header{position:sticky;top:0;z-index:20;background:#0f172ab8;backdrop-filter:blur(10px);border-bottom:1px solid #334155}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4ade80,#059669);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
  .card{background:#1e293bcc;border:1px solid #33415588;border-radius:18px;padding:20px;margin:16px 0}
  h1{font-size:16px;margin:0} h2{font-size:22px;margin:6px 0 10px} h3{margin:0 0 6px}
  .muted{color:var(--muted);font-size:13px}
  .grid3{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:900px){.grid3{grid-template-columns:1fr 1fr 1fr}}
  .pill{font-size:11px;background:#334155;padding:2px 8px;border-radius:999px;color:#cbd5e1}
  button{border:0;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;background:#334155;color:#e2e8f0}
  button:hover{background:#475569} button.active{background:#34d399;color:#064e3b}
  #playBtn{background:#34d399;color:#064e3b}
  select#modeSel, select#assetSel{background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#cbd5e1;margin:8px 0 12px}
  .dot{width:12px;height:12px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:middle}
  .chart-wrap{width:100%;background:#0b1220;border-radius:14px 14px 0 0;overflow:hidden;position:relative}
  svg{width:100%;height:auto;display:block;user-select:none}
  .range-wrap{background:#0b1220;border-radius:0 0 14px 14px;padding:8px 10px 12px;border-top:1px solid #1e293b}
  .range-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#94a3b8;margin-bottom:6px}
  #brushBox{position:relative;height:72px;cursor:crosshair}
  #brushBox svg.mini{position:absolute;inset:0;width:100%;height:72px;pointer-events:none;z-index:1}
  .handle{position:absolute;top:0;width:18px;height:72px;background:#34d399;border-radius:4px;cursor:ew-resize;z-index:6;pointer-events:auto}
  .handle::after{content:"";position:absolute;left:6px;top:24px;width:6px;height:24px;border-left:2px solid #064e3b;border-right:2px solid #064e3b}
  .win{position:absolute;top:0;height:72px;background:rgba(52,211,153,.16);border-top:2px solid #34d399;border-bottom:2px solid #34d399;z-index:4;cursor:grab;pointer-events:auto}
  .maskL,.maskR{position:absolute;top:0;height:72px;background:rgba(2,6,23,.55);z-index:2;pointer-events:none}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:#94a3b8;font-weight:500;padding:9px 10px;background:#0f172a}
  td{padding:9px 10px;border-top:1px solid #33415566;vertical-align:top}
  .r{text-align:right} .g{color:#6ee7b7} .pink{color:#f9a8d4} .red{color:#fca5a5} .dred{color:#fecaca}
  .best{outline:1px solid #34d39966;background:#064e3b22}
  .kpi{font-size:28px;font-weight:900;line-height:1.1}
  footer{text-align:center;color:#64748b;font-size:12px;padding:24px 8px 40px}
  .note{font-size:12px;color:#94a3b8;line-height:1.6}
  #fwdBox{display:none}
  #fwdGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:800px){#fwdGrid{grid-template-columns:repeat(6,1fr)}}
  .fwd{border-radius:14px;padding:12px;background:#0b1220;border:1px solid #334155}
  .fwd .h{font-size:12px;margin-bottom:4px}
  .fwd .v{font-size:22px;font-weight:900}
  .fwd .d{font-size:11px;color:#94a3b8;margin-top:4px}
  #tip{position:absolute;z-index:8;display:none;pointer-events:none;background:#064e3bee;color:#ecfdf5;border:1px solid #34d39966;border-radius:10px;padding:8px 10px;font-size:12px}
  #ypBox{display:block}

  select#modeSel{background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
  #maBox{display:none;align-items:center;gap:8px;flex-wrap:wrap}
  #maBox input{width:64px;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:7px 8px;font-weight:700}
  #maBox label{font-size:12px;color:#94a3b8}

</style>
</head>
<body>
<header>
  <div class="wrap row">
    <div class="row" style="gap:10px">
      <select id="assetSel">
        <option value="0050">0050 元大台灣50</option>
        <option value="BTC">比特幣 Bitcoin</option>
      </select>
      <div>
        <h1 id="headTitle">從高點回撤買進</h1>
        <div class="muted" id="headSub"></div>
      </div>
    </div>
    <div class="row" style="gap:10px;justify-content:flex-end">
      <select id="modeSel">
        <option value="dd">回撤買進</option>
        <option value="ma">均線 MA</option>
      </select>
      <span id="maBox">
        <label>短</label><input id="maFast" type="number" min="2" max="400" value="21">
        <label>長</label><input id="maSlow" type="number" min="3" max="600" value="60">
        <label>停損%</label><input id="slPct" type="number" step="0.5" max="-0.1" value="-5">
        <label>停利%</label><input id="tpPct" type="number" step="0.5" min="0.5" value="10">
        <button id="maApply">套用</button>
      </span>
      <div style="text-align:right">
        <div class="muted">最新</div>
        <div id="headLast" style="font-size:20px;font-weight:900;color:#6ee7b7"></div>
      </div>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <div class="muted" style="color:#34d399">規則相同</div>
    <h2 id="ruleTitle"></h2>
    <p class="note" id="ruleNote"></p>
  </div>
  <div class="grid3" id="evCards"></div>
  <div class="card">
    <div class="row">
      <div>
        <h3>走勢圖</h3>
        <div class="muted" id="chartHint"></div>
      </div>
      <div class="row">
        <button id="playBtn">▶ 播放</button>
        <button data-preset="all" class="preset active">全部</button>
        <button data-preset="10y" class="preset">10年</button>
        <button data-preset="5y" class="preset">5年</button>
        <button data-preset="3y" class="preset">3年</button>
        <button data-preset="1y" class="preset">1年</button>
        <button id="clearBtn">取消選取</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chartBox"><div id="tip"></div></div>
    <div class="range-wrap">
      <div class="range-meta"><span>拖曳綠框放大縮小</span><b id="rangeLabel" class="g"></b></div>
      <div id="brushBox">
        <div class="maskL" id="maskL"></div><div class="maskR" id="maskR"></div>
        <div class="win" id="win"></div>
        <div class="handle" id="hL"></div><div class="handle" id="hR"></div>
      </div>
    </div>
  </div>
  <div class="card" id="fwdBox">
    <div class="row" style="margin-bottom:12px"><div><h3 id="fwdTitle"></h3><div class="muted" id="fwdSub"></div></div></div>
    <div id="fwdGrid"></div>
  </div>
  <div class="card" style="padding:0;overflow:auto">
    <div style="padding:14px 16px;border-bottom:1px solid #334155"><h3 id="epTitle">每一波第一次碰到門檻</h3></div>
    <table>
      <thead><tr>
        <th>門檻</th><th>買進日／成本</th><th class="r">再跌</th><th class="r">回成本</th>
        <th class="r">1M</th><th class="r">3M</th><th class="r">6M</th>
        <th class="r">9M</th><th class="r">1Y</th><th class="r">3Y</th>
      </tr></thead>
      <tbody id="epBody"></tbody>
    </table>
  </div>
  <div class="card" id="ypBox" style="padding:0;overflow:auto">
    <div style="padding:14px 16px;border-bottom:1px solid #334155">
      <h3 id="sumTitle">與上方卡片同一批週期</h3>
      <div class="muted" id="sumNote">只算「每一波高點第一次碰到門檻」那幾次，不含配息。</div>
    </div>
    <table>
      <thead><tr>
        <th>門檻</th><th class="r">週期</th><th class="r">回成本中位</th>
        <th class="r">1年平均</th><th class="r">1年最差</th><th class="r">1年勝率</th>
        <th class="r">3年平均</th><th class="r">3年勝率</th>
      </tr></thead>
      <tbody id="sumBody"></tbody>
    </table>

  </div>
</div>
<footer>0050 為還原股價（含 2025/06 一拆四）。BTC 為 USD 收盤。歷史不代表未來。</footer>
<script>
let PACK;
async function boot(){
  try{
    const r = await fetch("data.json?t="+Date.now());
    if(!r.ok) throw new Error(r.status);
    PACK = await r.json();
  }catch(err){
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="padding:12px 16px;background:#7f1d1d;color:#fecaca">資料載入失敗，請確認 data.json 與網頁在同一層。'+err+'</div>');
    return;
  }

const DOT = ["#fbbf24","#fb7185","#991b1b"];
const HZN = [
  {key:"1m", label:"1個月", short:"1M", color:"#22d3ee", bg:"rgba(34,211,238,.22)"},
  {key:"3m", label:"3個月", short:"3M", color:"#38bdf8", bg:"rgba(56,189,248,.20)"},
  {key:"6m", label:"6個月", short:"6M", color:"#818cf8", bg:"rgba(129,140,248,.20)"},
  {key:"9m", label:"9個月", short:"9M", color:"#c084fc", bg:"rgba(192,132,252,.20)"},
  {key:"1y", label:"1年", short:"1Y", color:"#f472b6", bg:"rgba(244,114,182,.20)"},
  {key:"3y", label:"3年", short:"3Y", color:"#34d399", bg:"rgba(52,211,153,.18)"}
];
let assetId="0050", DATA=null, N=0, i0=0, i1=0, timer=null, selected=null;
let mode="dd", maFast=21, maSlow=60, slPct=-5, tpPct=10, maBuys=[], maSeries=null;
const parseDate=s=>new Date(s+"T00:00:00");
const fmt=s=>s.replace(/-/g,"/");
const pct=v=>v==null?"—":((v>0?"+":"")+v+"%");
const cls=v=>v==null?"":(v>=0?"g":"red");
function unit(){ return DATA.currency==="USD" ? "美元" : "元"; }
function money(v){
  if(v==null) return "—";
  if(DATA.currency==="USD") return Math.round(v).toLocaleString()+" USD";
  return v+" 元";
}
function ths(){ return DATA.thresholds.map(String); }
function allBuys(){
  if(mode==="ma") return maBuys;
  const arr=[];
  ths().forEach((k,idx)=>DATA.buys[k].forEach(e=>arr.push(Object.assign({k, idx}, e))));
  return arr;
}
function colorOf(th, ev){
  if(mode==="ma" && ev && ev.stopped) return "#ef4444";
  if(mode==="ma"){
    if(String(th)===String(maFast)) return "#fbbf24";
    if(String(th)===String(maSlow)) return "#c084fc";
    return "#38bdf8";
  }
  const i=DATA.thresholds.indexOf(+th);
  return DOT[i]||DOT[0];
}
function smaAt(arr, i, n){
  if(i+1<n) return null;
  let s=0;
  for(let k=i-n+1;k<=i;k++) s+=arr[k];
  return s/n;
}
function daysUntilPx(series, i, target){
  for(let j=i+1;j<series.length;j++){
    if(series[j].p>=target-1e-9){
      const a=parseDate(series[i].d), b=parseDate(series[j].d);
      return {days:Math.round((b-a)/86400000), date:series[j].d};
    }
  }
  return {days:null, date:null};
}
function fwdFrom(series, i, days){
  const target=new Date(parseDate(series[i].d).getTime()+days*86400000);
  for(let j=i;j<series.length;j++){
    if(parseDate(series[j].d)>=target){
      return {date:series[j].d, px:series[j].p, ret:Math.round((series[j].p/series[i].p-1)*1000)/10};
    }
  }
  return {date:null, px:null, ret:null};
}
function maEventsFor(period, maArr, idx){
  const series=DATA.series, px=series.map(p=>p.p);
  const hz=[["1m",30],["3m",91],["6m",182],["9m",273],["1y",365],["3y",1095]];
  const out=[];
  for(let i=1;i<px.length;i++){
    if(maArr[i-1]==null||maArr[i]==null) continue;
    // 跌破：昨收 >= 均線，今收 < 均線
    if(!(px[i-1]>=maArr[i-1] && px[i]<maArr[i])) continue;
    const buy=px[i];
    let extra=buy, extraJ=i, peak=buy, peakJ=i;
    const rec=daysUntilPx(series,i,buy);
    const holdTo=new Date(parseDate(series[i].d).getTime()+365*86400000);
    let end=px.length-1;
    for(let j=i;j<px.length;j++){
      if(parseDate(series[j].d)>=holdTo){ end=j; break; }
    }
    for(let j=i;j<=end;j++){
      if(px[j]<extra){ extra=px[j]; extraJ=j; }
      if(px[j]>peak){ peak=px[j]; peakJ=j; }
    }
    const e={
      th:String(period), k:String(period), idx:idx, period:period,
      buy_date:series[i].d, buy_px:Math.round(buy*100)/100,
      extra_dd:Math.round((extra/buy-1)*1000)/10,
      mfe:Math.round((peak/buy-1)*1000)/10,
      stopped:false, takeprofit:false,
      trough_date:series[extraJ].d, trough_px:Math.round(extra*100)/100,
      cost_date:rec.date, cost_days:rec.days,
      ret_1y:null, ret_3y:null, fwd:{}
    };
    hz.forEach(([name,d])=>{
      const r=fwdFrom(series,i,d);
      e.fwd[name]=r;
      if(name==="1y") e.ret_1y=r.ret;
      if(name==="3y") e.ret_3y=r.ret;
    });
    out.push(e);
  }
  return out;
}
function computeMa(){
  const series=DATA.series;
  const px=series.map(p=>p.p);
  let f=Math.round(+document.getElementById("maFast").value||21);
  let s=Math.round(+document.getElementById("maSlow").value||60);
  if(f<2) f=2; if(s<3) s=3;
  maFast=f; maSlow=s;
  document.getElementById("maFast").value=f;
  document.getElementById("maSlow").value=s;
  const fast=[], slow=[];
  for(let i=0;i<px.length;i++){
    fast.push(smaAt(px,i,f));
    slow.push(smaAt(px,i,s));
  }
  maSeries={fast, slow};
  slPct = +document.getElementById("slPct").value;
  if(!(slPct<0)) slPct=-5;
  document.getElementById("slPct").value=slPct;
  tpPct = +document.getElementById("tpPct").value;
  if(!(tpPct>0)) tpPct=10;
  document.getElementById("tpPct").value=tpPct;
  maBuys = maEventsFor(f, fast, 0).concat(maEventsFor(s, slow, 1));
  maBuys.forEach(e=>{
    e.stopped = e.extra_dd!=null && e.extra_dd<=slPct;
    e.takeprofit = e.mfe!=null && e.mfe>=tpPct;
  });
}
function applyMode(){
  document.getElementById("modeSel").value=mode;
  document.getElementById("maBox").style.display = mode==="ma" ? "flex" : "none";
  const name = assetId==="BTC" ? "比特幣" : "0050";
  if(mode==="ma"){
    computeMa();
    document.getElementById("headTitle").textContent = `${name}：跌破均線買進`;
    document.getElementById("headSub").textContent = `${DATA.start} – ${DATA.asof}｜收盤跌破 ${maFast}MA / ${maSlow}MA` + (DATA.updated ? `｜資料更新 ${DATA.updated}` : "");
    document.getElementById("ruleTitle").innerHTML = `收盤跌破 ${maFast}MA 或 ${maSlow}MA 當天買進<br>從上到下穿越才算一次，比較哪一條期望值較高`;
    document.getElementById("ruleNote").textContent = "跌破＝昨天收盤還在均線上（含觸及），今天收盤跌到均線下。同一條均線要先站回去，才會再記下一次。不含配息。";
    document.getElementById("chartHint").textContent = `黃＝跌破 ${maFast}MA　紫＝跌破 ${maSlow}MA　紅＝買進後再跌到 ${slPct}%`;
    document.getElementById("legend").innerHTML =
      `<span><i class="dot" style="background:#fbbf24"></i>跌破 ${maFast}MA</span>
       <span><i class="dot" style="background:#c084fc"></i>跌破 ${maSlow}MA</span>
       <span><i class="dot" style="background:#ef4444"></i>觸及停損 ${slPct}%</span>
       <span><i class="dot" style="background:#22d3ee;border-radius:3px"></i>1M</span>
       <span><i class="dot" style="background:#34d399;border-radius:3px"></i>3Y</span>`;
    document.getElementById("epTitle").textContent = `每一次跌破 ${maFast}MA / ${maSlow}MA`;
    document.getElementById("ypBox").style.display = "block";
  } else {
    document.getElementById("headTitle").textContent = assetId==="BTC" ? "比特幣：從高點回撤買進" : "0050：從高點回撤買進";
    document.getElementById("headSub").textContent = `${DATA.start} – ${DATA.asof}｜當時高點往下量` + (DATA.updated ? `｜資料更新 ${DATA.updated}` : "");
    document.getElementById("ruleTitle").innerHTML = assetId==="BTC"
      ? "跌破 −30%／−40%／−50% 當天買進<br>繼續跌沒關係，看多久回到成本、之後各期漲多少"
      : "跌破 −10%／−20%／−30% 當天買進<br>繼續跌沒關係，看多久回到成本、之後各期漲多少";
    document.getElementById("ruleNote").textContent = "從當時歷史高點往下量，每一波只記第一次碰到門檻。上方卡片的 1 年／3 年只用這幾次。點圖上的點看 1M～3Y。";
    document.getElementById("chartHint").textContent =
      DATA.thresholds.map((t,i)=>["黃","粉紅","深紅"][i]+" −"+t+"%").join("　")+"　點一下看持有期";
    document.getElementById("legend").innerHTML =
      DATA.thresholds.map((t,i)=>`<span><i class="dot" style="background:${DOT[i]}"></i>−${t}% 買進</span>`).join("")+
      `<span><i class="dot" style="background:#22d3ee;border-radius:3px"></i>1M</span>
       <span><i class="dot" style="background:#34d399;border-radius:3px"></i>3Y</span>`;
    document.getElementById("epTitle").textContent = "每一波第一次碰到門檻";
    document.getElementById("ypBox").style.display = assetId==="0050" ? "block" : "none";
  }
  document.getElementById("headLast").textContent = money(DATA.last);
}
function loadAsset(id){
  assetId=id;
  DATA=PACK.assets[id];
  N=DATA.series.length;
  i0=0; i1=N-1; selected=null; if(timer){clearInterval(timer); timer=null;}
  document.getElementById("assetSel").value=id;
  applyMode();
  renderFwd(null);
  evCards(); epTable(); sumTable();
  drawMain(); drawBrush();
}
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null; }
function med(arr){ if(!arr.length) return null; const s=arr.slice().sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; }
function win(arr){ return arr.length?100*arr.filter(x=>x>0).length/arr.length:null; }
function evCards(){
  const keys = mode==="ma" ? [String(maFast), String(maSlow)] : ths();
  document.getElementById("evCards").innerHTML = keys.map((k,i)=>{
    const eps = mode==="ma" ? maBuys.filter(e=>String(e.period)===String(k)) : DATA.buys[k];
    const costs=eps.map(e=>e.cost_days).filter(x=>x!=null);
    const r1=eps.map(e=>e.ret_1y).filter(x=>x!=null);
    const r3=eps.map(e=>e.ret_3y).filter(x=>x!=null);
    const best = i===ths().length-1;
    const fmtA=v=>v==null?"—":((v>0?"+":"")+v.toFixed(1)+"%");
    const fmtW=v=>v==null?"—":v.toFixed(0)+"%";
    return `<div class="card ${best?"best":""}">
      <div class="row"><b>${mode==="ma"? ("跌破 "+k+"MA") : ("跌 −"+k+"% 買")}</b><span class="pill">${eps.length} 次</span></div>
      <div class="muted" style="margin-top:10px">回成本中位數（這 ${eps.length} 次）</div>
      <div class="kpi g">${med(costs)??"—"} <span style="font-size:14px">天</span></div>
      <div class="muted">平均 ${costs.length?Math.round(avg(costs)): "—"} 天　${costs.length}/${eps.length} 次回到成本</div>
      <div class="row" style="margin-top:10px"><span>1年平均（${r1.length}筆）</span><b class="${avg(r1)>=0?"g":"red"}">${fmtA(avg(r1))}</b></div>
      <div class="row"><span>1年勝率</span><b>${fmtW(win(r1))}</b></div>
      <div class="row"><span>3年平均（${r3.length}筆）</span><b class="${avg(r3)>=0?"g":"red"}">${fmtA(avg(r3))}</b></div>
      <div class="row"><span>3年勝率</span><b class="g">${fmtW(win(r3))}</b></div>
      ${mode==="ma"?`<div class="row"><span>1年內觸及停損 ${slPct}%</span><b class="red">${eps.length?Math.round(100*eps.filter(e=>e.stopped).length/eps.length):0}%</b></div>
      <div class="row"><span>1年內觸及停利 +${tpPct}%</span><b class="g">${eps.length?Math.round(100*eps.filter(e=>e.takeprofit).length/eps.length):0}%</b></div>`:""}
    </div>`;
  }).join("");
}
function renderFwd(e){
  const box=document.getElementById("fwdBox");
  if(!e){ box.style.display="none"; return; }
  box.style.display="block";
  document.getElementById("fwdTitle").textContent = (mode==="ma"? `跌破 ${e.period}MA`:`−${e.th}% 買進`) + `　${e.buy_date}　成本 ${money(e.buy_px)}`;
  document.getElementById("fwdSub").textContent = `回成本 ${e.cost_date||"尚未"}（${e.cost_days??"—"} 天）　買進後再跌 ${e.extra_dd}%` + (mode==="ma"?((e.stopped?`　已觸及停損 ${slPct}%`:`　未觸及停損 ${slPct}%`)+(e.takeprofit?`　已觸及停利 +${tpPct}%`:`　未觸及停利 +${tpPct}%`)+`　最高曾 +${e.mfe}%`):"");
  document.getElementById("fwdGrid").innerHTML = HZN.map(h=>{
    const f=e.fwd[h.key]; const ret=f&&f.ret;
    return `<div class="fwd" style="border-color:${h.color}66">
      <div class="h" style="color:${h.color}">${h.label}</div>
      <div class="v ${cls(ret)}">${pct(ret)}</div>
      <div class="d">${f&&f.date ? f.date+"　"+money(f.px) : "資料不足"}</div>
    </div>`;
  }).join("");
}
function sumTable(){
  const box=document.getElementById("ypBox");
  document.getElementById("sumTitle").textContent = (assetId==="BTC"?"比特幣":"0050") + (mode==="ma"?`：跌破 ${maFast}MA / ${maSlow}MA`:"：與上方卡片同一批週期");
  const keys = mode==="ma" ? [String(maFast), String(maSlow)] : ths();
  document.getElementById("sumBody").innerHTML = keys.map((k,i)=>{
    const eps = mode==="ma" ? maBuys.filter(e=>String(e.period)===String(k)) : DATA.buys[k];
    const costs=eps.map(e=>e.cost_days).filter(x=>x!=null);
    const r1=eps.map(e=>e.ret_1y).filter(x=>x!=null);
    const r3=eps.map(e=>e.ret_3y).filter(x=>x!=null);
    const a=arr=>arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:null;
    const m=arr=>{ if(!arr.length) return null; return arr.slice().sort((x,y)=>x-y)[Math.floor(arr.length/2)]; };
    const w=arr=>arr.length?100*arr.filter(x=>x>0).length/arr.length:null;
    const mn=arr=>arr.length?Math.min(...arr):null;
    const fa=v=>v==null?"—":((v>0?"+":"")+v.toFixed(1)+"%");
    const fw=v=>v==null?"—":v.toFixed(0)+"%";
    const bg=i===1?' style="background:#064e3b22"':"";
    return `<tr${bg}>
      <td style="color:${colorOf(k)}"><b>${mode==="ma"?"跌破 "+k+"MA":"−"+k+"%"}</b></td>
      <td class="r">${eps.length} 次</td>
      <td class="r">${m(costs)??"—"} 天</td>
      <td class="r ${a(r1)>=0?"g":"red"}">${fa(a(r1))} <span class="muted">(${r1.length})</span></td>
      <td class="r ${mn(r1)>=0?"g":"red"}">${fa(mn(r1))}</td>
      <td class="r">${fw(w(r1))}</td>
      <td class="r ${a(r3)>=0?"g":"red"}">${fa(a(r3))} <span class="muted">(${r3.length})</span></td>
      <td class="r g">${fw(w(r3))}</td>
    </tr>`;
  }).join("");
}
function epTable(){
  document.getElementById("epBody").innerHTML = allBuys().sort((a,b)=>a.buy_date<b.buy_date?1:-1).map(e=>{
    const cell=k=>{const r=e.fwd[k].ret; return `<td class="r ${cls(r)}">${pct(r)}</td>`;};
    return `<tr>
      <td style="color:${colorOf(e.th,e)}"><b>${mode==="ma"?"跌破 "+e.period+"MA":"−"+e.th+"%"}</b></td>
      <td>${e.buy_date}<div class="muted">${money(e.buy_px)}</div></td>
      <td class="r">${e.extra_dd}%</td>
      <td class="r g">${e.cost_days??"—"}天</td>
      ${cell("1m")}${cell("3m")}${cell("6m")}${cell("9m")}${cell("1y")}${cell("3y")}
    </tr>`;
  }).join("");
}
function chartMetrics(series){
  const W=1100,H=500,m={l:70,r:18,t:64,b:44};
  const plotW=W-m.l-m.r, plotH=H-m.t-m.b;
  const prices=series.map(p=>p.p);
  const ymin=Math.max(0,Math.min(...prices)*0.92);
  const ymax=Math.max(...prices)*1.12;
  const t0=parseDate(series[0].d).getTime();
  const t1=parseDate(series[series.length-1].d).getTime()||t0+1;
  return {W,H,m,plotW,plotH,ymin,ymax,t0,t1,
    yOf:p=>m.t+(1-(p-ymin)/(ymax-ymin||1))*plotH,
    xS:s=>m.l+(parseDate(s).getTime()-t0)/(t1-t0)*plotW};
}
function seriesBetween(start,end){ return DATA.series.filter(p=>p.d>=start && p.d<=end); }
function drawMain(){
  const series=DATA.series.slice(i0,i1+1);
  const box=document.getElementById("chartBox");
  const C=chartMetrics(series);
  const pts=series.map(p=>`${C.xS(p.d).toFixed(1)},${C.yOf(p.p).toFixed(1)}`).join(" ");
  const last=series[series.length-1];
  let xticks="", yticks="";
  const y0=parseInt(series[0].d.slice(0,4)), y1=parseInt(series[series.length-1].d.slice(0,4));
  for(let y=y0;y<=y1+1;y++){
    const xs=C.xS(y+"-01-01");
    if(xs<C.m.l||xs>C.m.l+C.plotW) continue;
    if((i1-i0)>800 && y%2) continue;
    xticks+=`<line x1="${xs}" y1="${C.m.t+C.plotH}" x2="${xs}" y2="${C.m.t+C.plotH+5}" stroke="#64748b"/>
      <text x="${xs}" y="${C.H-12}" text-anchor="middle" fill="#94a3b8" font-size="12">${y}</text>`;
  }
  const span=C.ymax-C.ymin;
  const nice = span>20000?20000: span>5000?5000: span>80?20: span>40?10:5;
  for(let v=Math.ceil(C.ymin/nice)*nice; v<=C.ymax; v+=nice){
    const yy=C.yOf(v);
    const lab = DATA.currency==="USD" ? (v>=1000?(Math.round(v/1000)+"k"):v) : v;
    yticks+=`<line x1="${C.m.l}" y1="${yy}" x2="${C.m.l+C.plotW}" y2="${yy}" stroke="#1e293b"/>
      <text x="${C.m.l-8}" y="${yy+4}" text-anchor="end" fill="#94a3b8" font-size="11">${lab}</text>`;
  }
  let bands="", segs="", marks2="", labels="";
  if(selected){
    const e=selected; let prev=e.buy_date;
    HZN.forEach(h=>{
      const f=e.fwd[h.key]; if(!f||!f.date) return;
      const down=f.ret!=null && f.ret<0;
      const col=down?"#ef4444":h.color;
      const bg=down?"rgba(239,68,68,.20)":h.bg;
      const a=parseDate(prev).getTime(), b=parseDate(f.date).getTime();
      if(b<C.t0||a>C.t1){ prev=f.date; return; }
      const x1=C.m.l+(Math.max(a,C.t0)-C.t0)/(C.t1-C.t0)*C.plotW;
      const x2=C.m.l+(Math.min(b,C.t1)-C.t0)/(C.t1-C.t0)*C.plotW;
      bands+=`<rect x="${x1.toFixed(1)}" y="${C.m.t}" width="${Math.max(1,x2-x1).toFixed(1)}" height="${C.plotH}" fill="${bg}"/>`;
      const chunk=seriesBetween(prev,f.date).filter(p=>p.d>=series[0].d && p.d<=series[series.length-1].d);
      if(chunk.length>=2){
        segs+=`<polyline fill="none" stroke="${col}" stroke-width="3.2" points="${chunk.map(p=>C.xS(p.d).toFixed(1)+','+C.yOf(p.p).toFixed(1)).join(' ')}"/>`;
      }
      if(b>=C.t0&&b<=C.t1){
        const x=C.xS(f.date), y=C.yOf(f.px);
        marks2+=`<line x1="${x}" y1="4" x2="${x}" y2="${C.m.t+C.plotH}" stroke="${col}" stroke-width="1.15" stroke-dasharray="3 4"/>`;
        marks2+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${col}" stroke="#0b1220"/>`;
      }
      prev=f.date;
    });
    HZN.forEach(h=>{
      const f=e.fwd[h.key]; if(!f||!f.date) return;
      const t=parseDate(f.date).getTime(); if(t<C.t0||t>C.t1) return;
      const down=f.ret!=null && f.ret<0; const col=down?"#ef4444":h.color;
      let x=C.xS(f.date);
      if(x<C.m.l+18) x=C.m.l+18; if(x>C.m.l+C.plotW-18) x=C.m.l+C.plotW-18;
      labels+=`<text x="${x.toFixed(1)}" y="15" text-anchor="middle" fill="${col}" font-size="10" font-weight="700">${h.short}</text>`;
      labels+=`<text x="${x.toFixed(1)}" y="29" text-anchor="middle" fill="${col}" font-size="12" font-weight="800">${pct(f.ret)}</text>`;
    });
    const xb=C.xS(e.buy_date);
    if(parseDate(e.buy_date)>=C.t0 && parseDate(e.buy_date)<=C.t1){
      bands+=`<line x1="${xb}" y1="4" x2="${xb}" y2="${C.m.t+C.plotH}" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      labels+=`<text x="${xb.toFixed(1)}" y="${C.m.t+C.plotH+16}" text-anchor="middle" fill="#cbd5e1" font-size="11">買進 ${e.buy_date}</text>`;
    }
  }
  let maLines="";
  if(mode==="ma" && maSeries){
    const mk=(arr,col)=>{
      const pts=[];
      for(let i=i0;i<=i1;i++){
        const v=arr[i]; if(v==null) continue;
        pts.push(C.xS(DATA.series[i].d).toFixed(1)+","+C.yOf(v).toFixed(1));
      }
      return pts.length>1?`<polyline fill="none" stroke="${col}" stroke-width="1.5" opacity="0.9" points="${pts.join(" ")}"/>`:"";
    };
    maLines = mk(maSeries.fast,"#fbbf24")+mk(maSeries.slow,"#c084fc");
  }
  const buys=allBuys(); let marks="";
  buys.forEach((e,n)=>{
    const t=parseDate(e.buy_date).getTime(); if(t<C.t0||t>C.t1) return;
    const x=C.xS(e.buy_date), y=C.yOf(e.buy_px);
    const r=e.idx===2?7:e.idx===1?6:5;
    const on=selected && selected.buy_date===e.buy_date && selected.th===e.th;
    marks+=`<circle class="buy-hit" data-n="${n}" cx="${x}" cy="${y}" r="${r+11}" fill="transparent" style="cursor:pointer"/>`;
    marks+=`<circle cx="${x}" cy="${y}" r="${on?r+2:r}" fill="${colorOf(e.th,e)}" stroke="${on?"#fff":"#0b1220"}" stroke-width="${on?2:1.4}" style="pointer-events:none"/>`;
  });
  box.innerHTML=`<div id="tip"></div>
    <svg viewBox="0 0 ${C.W} ${C.H}" id="mainSvg">
      <rect width="${C.W}" height="${C.H}" fill="#0b1220"/>
      ${yticks}${bands}
      <polyline fill="none" stroke="#38bdf8" stroke-width="2" opacity="${selected?0.25:1}" points="${pts}"/>
      ${maLines}
      ${segs}${marks}${marks2}${labels}${xticks}
      <circle cx="${C.xS(last.d)}" cy="${C.yOf(last.p)}" r="3.5" fill="#38bdf8"/>
      <text x="${C.m.l}" y="${C.H-8}" fill="#64748b" font-size="11">${fmt(series[0].d)} → ${fmt(last.d)}</text>
    </svg>`;
  box.querySelectorAll("circle.buy-hit").forEach(el=>{
    el.addEventListener("click", ev=>{
      ev.stopPropagation();
      const e=buys[+el.dataset.n];
      selected = (selected && selected.buy_date===e.buy_date && selected.th===e.th) ? null : e;
      renderFwd(selected); drawMain();
    });
    el.addEventListener("mouseenter", ()=>{
      const e=buys[+el.dataset.n];
      const tip=document.getElementById("tip");
      tip.style.display="block";
      tip.innerHTML=`<b>${mode==="ma"?"跌破 "+e.period+"MA":"−"+e.th+"%"}</b> ${e.buy_date}<br>點擊查看 1M～3Y`;
    });
  });
  document.getElementById("mainSvg").addEventListener("mousemove", ev=>{
    const tip=document.getElementById("tip"); if(tip.style.display!=="block") return;
    const rect=box.getBoundingClientRect();
    tip.style.left=(ev.clientX-rect.left+12)+"px"; tip.style.top=(ev.clientY-rect.top+12)+"px";
  });
  document.getElementById("mainSvg").addEventListener("mouseleave", ()=>{ document.getElementById("tip").style.display="none"; });
}
function drawBrush(){
  const box=document.getElementById("brushBox");
  const W=1100,H=72;
  const src=(DATA.weekly&&DATA.weekly.length)?DATA.weekly:DATA.series.filter((_,i)=>i%5===0);
  const prices=src.map(p=>p.p);
  const ymin=Math.min(...prices), ymax=Math.max(...prices);
  const M=Math.max(1,src.length-1);
  const pts=src.map((p,i)=> (i/M*W).toFixed(1)+','+(6+(1-(p.p-ymin)/(ymax-ymin))*(H-12)).toFixed(1)).join(' ');
  let svg=box.querySelector("svg.mini");
  if(!svg){
    svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","mini");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","none");
    box.insertBefore(svg, box.firstChild);
  }
  svg.innerHTML=`<rect width="${W}" height="${H}" fill="#0b1220"/><polyline fill="none" stroke="#64748b" stroke-width="1.6" points="${pts}"/>`;
  layoutBrush();
}
function layoutBrush(){
  const box=document.getElementById("brushBox");
  const w=box.clientWidth||1;
  const xL=i0/(N-1)*w, xR=i1/(N-1)*w;
  document.getElementById("hL").style.left=(xL-9)+"px";
  document.getElementById("hR").style.left=(xR-9)+"px";
  document.getElementById("win").style.left=xL+"px";
  document.getElementById("win").style.width=Math.max(8,xR-xL)+"px";
  document.getElementById("maskL").style.width=xL+"px";
  document.getElementById("maskR").style.left=xR+"px";
  document.getElementById("maskR").style.width=(w-xR)+"px";
  rangeLabel.textContent=fmt(DATA.series[i0].d)+" ～ "+fmt(DATA.series[i1].d);
}
function setRange(a,b,fromPreset){
  i0=Math.max(0,Math.min(a,b)); i1=Math.min(N-1,Math.max(a,b));
  if(i1-i0<20) i1=Math.min(N-1,i0+20);
  if(!fromPreset) document.querySelectorAll(".preset").forEach(b=>b.classList.remove("active"));
  drawMain(); layoutBrush();
}
function applyPreset(key){
  document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("active", b.dataset.preset===key));
  const end=N-1, last=parseDate(DATA.series[end].d);
  const fromYears=y=>{const t=new Date(last); t.setFullYear(t.getFullYear()-y);
    let idx=0; for(let i=0;i<N;i++){ if(parseDate(DATA.series[i].d)>=t){idx=i;break;} } return idx; };
  if(key==="all") setRange(0,end,true); else setRange(fromYears(+key.replace("y","")), end, true);
}
function bindBrush(){
  const box=document.getElementById("brushBox");
  const leftH=document.getElementById("hL");
  const rightH=document.getElementById("hR");
  const mid=document.getElementById("win");
  const pos=cx=>{
    const r=box.getBoundingClientRect();
    const w=Math.max(1,r.width);
    return Math.round(Math.min(1,Math.max(0,(cx-r.left)/w))*(N-1));
  };
  let mode=null,startX=0,s0=0,s1=0;
  const down=(e,m)=>{
    e.preventDefault();
    e.stopPropagation();
    mode=m;
    startX=(e.touches?e.touches[0].clientX:e.clientX);
    s0=i0; s1=i1;
    mid.style.cursor="grabbing";
  };
  leftH.onpointerdown=e=>down(e,"L");
  rightH.onpointerdown=e=>down(e,"R");
  mid.onpointerdown=e=>down(e,"W");
  box.onpointerdown=e=>{
    if(mode) return;
    if(e.target===leftH || e.target===rightH || e.target===mid) return;
    const i=pos(e.clientX);
    const span=Math.max(20, i1-i0);
    setRange(i-Math.floor(span/2), i+Math.ceil(span/2));
  };
  const move=e=>{
    if(!mode) return;
    const cx=e.clientX;
    if(mode==="L") setRange(Math.min(pos(cx),i1-20),i1);
    if(mode==="R") setRange(i0,Math.max(pos(cx),i0+20));
    if(mode==="W"){
      const r=box.getBoundingClientRect();
      const dx=((cx-startX)/Math.max(1,r.width))*(N-1);
      setRange(Math.round(s0+dx), Math.round(s1+dx));
    }
  };
  const up=()=>{ mode=null; mid.style.cursor="grab"; };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}
document.getElementById("assetSel").onchange=e=>loadAsset(e.target.value);
document.getElementById("modeSel").onchange=e=>{
  mode=e.target.value; selected=null;
  applyMode(); renderFwd(null); evCards(); epTable(); sumTable(); drawMain();
};
document.getElementById("maApply").onclick=()=>{
  mode="ma"; selected=null;
  applyMode(); renderFwd(null); evCards(); epTable(); sumTable(); drawMain();
};
document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));
document.getElementById("clearBtn").onclick=()=>{ selected=null; renderFwd(null); drawMain(); };
document.getElementById("playBtn").onclick=()=>{
  if(timer) return;
  playBtn.disabled=true; playBtn.textContent="播放中…";
  let k=80; setRange(0,k,true);
  timer=setInterval(()=>{
    k+=40;
    if(k>=N){ clearInterval(timer); timer=null; setRange(0,N-1,true); playBtn.disabled=false; playBtn.textContent="▶ 播放"; return; }
    setRange(0,k,true);
  },55);
};
window.addEventListener("resize", ()=>{ if(DATA) layoutBrush(); });
loadAsset("0050");
bindBrush();
}
boot();
</script>
